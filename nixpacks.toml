# Railway Nixpacks configuration for propenat-backend (Django + WeasyPrint)
# WeasyPrint requires native system libraries for PDF generation

[phases.setup]
# Preserve default packages, then add libs for WeasyPrint: cairo stack, fonts, & FFI
nixPkgs = [
    "...",
    # Core Cairo graphics stack (REQUIRED by WeasyPrint)
    "cairo",
    "pango", 
    "glib",
    "gobject-introspection",
    "gdk-pixbuf",
    
    # Supporting libraries
    "harfbuzz",
    "fontconfig",
    "freetype",
    "libffi",
    
    # Fonts
    "noto-fonts",
    "liberation_ttf",
    
    # utilities
    "shared-mime-info",
    "pkg-config",
]

[phases.build]
cmds = [
    "pip install --upgrade pip setuptools wheel",
    "pip install -r requirements.txt",
]

# Start command for Railway/production
[start]
cmd = "gunicorn --bind 0.0.0.0:8000 --workers 2 sipora_be.wsgi:application"
